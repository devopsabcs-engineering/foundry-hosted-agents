name: Publish Versioned Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-versioned-artifacts
  cancel-in-progress: false
  queue: max

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.version.outputs.releases }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test release allocator and publication contracts
        run: |
          python -m pip install pytest pyyaml
          python -m pytest scripts/tests/test_release_version.py -q
      - name: Assign and atomically publish release tags
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python scripts/release_version.py --target "$GITHUB_SHA" --before "$BEFORE" --output releases.json
          mapfile -t TAGS < <(jq -r '.[].version | "refs/tags/v" + .' releases.json)
          git push --atomic origin "${TAGS[@]}"
          echo "releases=$(jq -c . releases.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.[-1].version' releases.json)" >> "$GITHUB_OUTPUT"
          echo '## Source versions (publication status is reported by downstream jobs)' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- v\(.version): `\(.commit)`"' releases.json >> "$GITHUB_STEP_SUMMARY"

  containers:
    needs: version
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        release: ${{ fromJSON(needs.version.outputs.releases) }}
        component:
          - image: web-chat
            context: apps/web-chat
          - image: staging/defender-mcp
            context: mcp/defender-server
          - image: staging/anomaly-mcp
            context: mcp/anomaly-server
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.release.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: matrix.component.image == 'web-chat'
        with:
          python-version: '3.13'
      - name: Test web backend before publication
        if: matrix.component.image == 'web-chat'
        env:
          PYTHONPATH: apps/web-chat
        run: |
          python -m pip install -r apps/web-chat/requirements.txt pytest
          python -m pytest apps/web-chat/tests -q
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, push and lock versioned container tags
        env:
          REGISTRY: ${{ vars.MCP_ACR_NAME }}
          IMAGE: ${{ matrix.component.image }}
          CONTEXT: ${{ matrix.component.context }}
          APP_VERSION: ${{ matrix.release.version }}
          SOURCE_SHA: ${{ matrix.release.commit }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY"
          VERSION_IMAGE="${IMAGE}:${APP_VERSION}"
          SHA_IMAGE="${IMAGE}:sha-${SOURCE_SHA}"
          if ! az acr repository show --name "$REGISTRY" --image "$VERSION_IMAGE" > /dev/null 2>&1; then
            az acr build --registry "$REGISTRY" --image "$VERSION_IMAGE" --image "$SHA_IMAGE" \
              --build-arg "APP_VERSION=$APP_VERSION" --build-arg "GIT_SHA=$SOURCE_SHA" "$CONTEXT"
          fi
          DIGEST=$(az acr repository show --name "$REGISTRY" --image "$VERSION_IMAGE" --query digest -o tsv)
          SHA_DIGEST=$(az acr repository show --name "$REGISTRY" --image "$SHA_IMAGE" --query digest -o tsv)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] && test "$DIGEST" = "$SHA_DIGEST"
          for TAG in "$VERSION_IMAGE" "$SHA_IMAGE"; do
            az acr repository update --name "$REGISTRY" --image "$TAG" --write-enabled false --delete-enabled false > /dev/null
          done
          SERVER=$(az acr show --name "$REGISTRY" --query loginServer -o tsv)
          echo "Published \`${SERVER}/${VERSION_IMAGE}\` and \`${SHA_IMAGE}\` at \`${DIGEST}\`." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - name: Build versioned workshop
        working-directory: docs
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          JEKYLL_ENV: production
        run: |
          printf 'release_version: "%s"\n' "$APP_VERSION" > release-site.yml
          bundle exec jekyll build --config _config.yml,release-site.yml --destination ../_site
          rm -f ../_site/release-site.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment