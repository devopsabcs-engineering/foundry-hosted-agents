name: Deploy and Evaluate (Staging -> Production)

# Shared by both manual release entry points. This workflow implements the full
# eval-gated release-control flow from the research CI/CD mermaid diagram
# (air-canada-foundry-hosted-agents-research.md, "CI/CD and Release
# Control", lines 518-533): lint -> Bicep validate/what-if -> deploy an
# immutable candidate to staging -> smoke/contract/streaming tests ->
# offline evaluation quality gate -> manual production approval ->
# promote -> post-deploy monitoring -> rollback on breach.

on:
  workflow_call:
    inputs:
      golden_dataset_path:
        type: string
        required: false
        default: eval/golden-dataset.jsonl
  workflow_dispatch:
    inputs:
      golden_dataset_path:
        description: "Path to the golden dataset used for the evaluation gate"
        required: false
        default: eval/golden-dataset.jsonl

# Manual dispatch only: auto-firing on every push to main caused
# duplicate manual+auto runs and raced concurrently against
# hosted-agent-cd.yml's own provision/deploy against the same shared
# Cognitive Services account -- see hosted-agent-cd.yml's trigger
# comment for the RBAC-flake connection.

# Secretless OIDC federation (no stored client secrets), mirroring the
# proven pattern in hosted-agent-cd.yml.
permissions:
  id-token: write
  contents: read

concurrency:
  group: foundry-shared-environments
  queue: max

env:
  AGENT_PROJECT_DIR: .
  AGENT_NAME: threat-assessment-agent
  GOLDEN_DATASET_PATH: ${{ inputs.golden_dataset_path || 'eval/golden-dataset.jsonl' }}
  AGENT_TEST_PROMPT: "Hello from CI. Reply with a short confirmation that you are running and ready to assess threats."
  STAGING_AZD_ENV_NAME: air-canada-threat-assessment-staging
  PRODUCTION_AZD_ENV_NAME: air-canada-threat-assessment-poc

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Lint, unit tests, dependency scan
  # ---------------------------------------------------------------------
  lint:
    name: Lint, unit tests, dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install lint and test tooling (CI-only; not part of the runtime image)
        run: pip install ruff pytest

      - name: Ruff check (evaluation suite; see ruff.toml for scope rationale)
        run: ruff check eval

      - name: Agent graph unit tests
        run: |
          pip install -r src/threat-assessment-agent/requirements.txt -r src/threat-assessment-agent/requirements-dev.txt
          pytest src/threat-assessment-agent/tests/ -v --junitxml=offline-evidence/agent.xml

      - name: Deterministic evaluation checks (must fail on the injected bad example)
        run: pytest eval/deterministic-tests/ -v --junitxml=offline-evidence/deterministic.xml

      - name: Reporting and workflow contract tests
        run: pytest scripts/tests/ -v --junitxml=offline-evidence/reporting.xml

      - name: Responses contract validator regression tests
        run: bash scripts/test-agent-response.sh

      - name: Runtime role assignment regression tests
        run: bash scripts/test-agent-rbac.sh

      - name: Production version discovery regression tests
        run: bash scripts/test-production-version.sh

      - name: Publish offline test summary
        if: always()
        run: |
          python scripts/ci_results.py --junit offline-evidence
          python scripts/deployment_summary.py

      - name: Retain offline test measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-test-evidence-${{ github.run_attempt }}
          path: offline-evidence/*.xml
          retention-days: 30

  # ---------------------------------------------------------------------
  # Stage 2: Bicep validate and what-if
  # ---------------------------------------------------------------------
  bicep-validate:
    name: Bicep validate and what-if
    needs: [lint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az bicep build (full module graph)
        run: az bicep build --file infra/main.bicep

      - name: az deployment group what-if (staging resource group)
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          MCP_ACR_NAME: ${{ vars.MCP_ACR_NAME }}
          DEFENDER_MCP_IMAGE: ${{ vars.DEFENDER_MCP_IMAGE }}
          ANOMALY_MCP_IMAGE: ${{ vars.ANOMALY_MCP_IMAGE }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters environmentName="$STAGING_AZD_ENV_NAME" location="$AZURE_LOCATION" \
              mcpAcrName="$MCP_ACR_NAME" defenderMcpImage="$DEFENDER_MCP_IMAGE" anomalyMcpImage="$ANOMALY_MCP_IMAGE"

  # ---------------------------------------------------------------------
  # Stage 3: Deploy immutable candidate to staging
  # ---------------------------------------------------------------------
  deploy-staging:
    name: Deploy immutable candidate to staging
    needs: [bicep-validate]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      agent_version: ${{ steps.deploy.outputs.agent_version }}
      project_endpoint: ${{ steps.deploy.outputs.project_endpoint }}
      defender_mcp_image: ${{ steps.build-mcp.outputs.defender_mcp_image }}
      anomaly_mcp_image: ${{ steps.build-mcp.outputs.anomaly_mcp_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure staging deployment environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd env select "$STAGING_AZD_ENV_NAME" || azd env new "$STAGING_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set FOUNDRY_PROJECT_ENDPOINT "https://aif-${STAGING_AZD_ENV_NAME}.services.ai.azure.com/api/projects/proj-${STAGING_AZD_ENV_NAME}"
          azd env set AZURE_AI_PROJECT_ID "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/aif-${STAGING_AZD_ENV_NAME}/projects/proj-${STAGING_AZD_ENV_NAME}"
          azd env set FOUNDRY_MODEL_NAME "${{ vars.FOUNDRY_MODEL_NAME }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          azd env set DEFENDER_MCP_IMAGE "${{ vars.DEFENDER_MCP_IMAGE }}"
          azd env set ANOMALY_MCP_IMAGE "${{ vars.ANOMALY_MCP_IMAGE }}"

      - name: Build immutable staging MCP fixture images
        id: build-mcp
        env:
          MCP_ACR_NAME: ${{ vars.MCP_ACR_NAME }}
        run: |
          set -euo pipefail
          REGISTRY=$(az acr show --name "$MCP_ACR_NAME" --query loginServer -o tsv)
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for SERVER in defender anomaly; do
            IMAGE="staging/${SERVER}-mcp:${TAG}"
            az acr build --registry "$MCP_ACR_NAME" --image "$IMAGE" "mcp/${SERVER}-server"
            DIGEST=$(az acr repository show --name "$MCP_ACR_NAME" --image "$IMAGE" --query digest -o tsv)
            [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid image digest"; exit 1; }
            azd env set "${SERVER^^}_MCP_IMAGE" "${REGISTRY}/staging/${SERVER}-mcp@${DIGEST}"
            echo "${SERVER}_mcp_image=${REGISTRY}/staging/${SERVER}-mcp@${DIGEST}" >> "$GITHUB_OUTPUT"
          done

      - name: Provision staging infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd provision --no-prompt

      - name: Deploy candidate (new immutable hosted-agent version)
        id: deploy
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          PROJECT_ENDPOINT=$(azd env get-values --output json | jq -er '.FOUNDRY_PROJECT_ENDPOINT')
          EXPECTED_ENDPOINT="https://aif-${STAGING_AZD_ENV_NAME}.services.ai.azure.com/api/projects/proj-${STAGING_AZD_ENV_NAME}"
          if [ "${PROJECT_ENDPOINT%/}" != "$EXPECTED_ENDPOINT" ]; then
            echo "::error::Staging resolved to $PROJECT_ENDPOINT instead of $EXPECTED_ENDPOINT; refusing to deploy."
            exit 1
          fi
          for SERVER in defender anomaly; do
            TOOL_URL=$(azd env get-values --output json | jq -er --arg key "${SERVER^^}_MCP_URL" '.[$key]')
            case "$TOOL_URL" in
              https://mcp-staging-"${SERVER}"-server.*.azurecontainerapps.io/mcp) ;;
              *) echo "::error::Staging tool URL is not isolated: $TOOL_URL"; exit 1 ;;
            esac
          done
          azd deploy --no-prompt

          azd ai agent show "$AGENT_NAME" --output json > /tmp/agent-show.json
          AGENT_VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+$"))' /tmp/agent-show.json)
          jq -e '.status == "active"' /tmp/agent-show.json
          echo "Deployed candidate version: $AGENT_VERSION"
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "project_endpoint=$PROJECT_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Grant staging runtime model access
        run: bash scripts/configure-agent-rbac.sh "$AGENT_NAME"

      # Downstream jobs run on fresh runners with no local .azure state.
      # 'azd deploy' writes agent-specific bookkeeping keys (e.g.
      # AGENT_THREAT_ASSESSMENT_AGENT_ENDPOINT/VERSION) into the local
      # .env that 'azd ai agent invoke' needs to recognize the service as
      # deployed; reconstructing only the input vars is not sufficient.
      - name: Upload azd environment state (for downstream jobs)
        uses: actions/upload-artifact@v6
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------
  # Stage 4: Smoke, contract, and streaming tests against staging
  # ---------------------------------------------------------------------
  staging-tests:
    name: Smoke, contract, and streaming tests
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download azd environment state (from deploy-staging)
        uses: actions/download-artifact@v7
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/

      - name: Configure azd authentication and select staging environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env select "$STAGING_AZD_ENV_NAME"

      - name: Smoke test (validated Responses-protocol invoke)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        env:
          AGENT_VERSION: ${{ needs.deploy-staging.outputs.agent_version }}
        run: |
          set -euo pipefail
          test -n "$AGENT_VERSION"
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            set +e
            bash scripts/invoke-agent.sh > "/tmp/agent-response-attempt-$attempt.sse" 2> "/tmp/agent-response-attempt-$attempt.txt"
            INVOKE_EXIT=$?
            set -e
            echo "--- Agent response (attempt $attempt/$MAX_ATTEMPTS) ---"
            cat "/tmp/agent-response-attempt-$attempt.txt" "/tmp/agent-response-attempt-$attempt.sse"
            echo "--- End agent response ---"
            if [ $INVOKE_EXIT -eq 0 ] && jq -Rse -f scripts/validate-agent-response.jq "/tmp/agent-response-attempt-$attempt.sse"; then
              cp "/tmp/agent-response-attempt-$attempt.sse" /tmp/agent-response.sse
              break
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Candidate $AGENT_VERSION failed after $MAX_ATTEMPTS fresh-session attempts (exit $INVOKE_EXIT); inspect the response above for the actual error."
              exit 1
            fi
            echo "::warning::Attempt $attempt failed (exit $INVOKE_EXIT); retrying in 15s."
            sleep 15
          done

      - name: Contract and streaming tests (Responses SSE)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          jq -Rse -f scripts/validate-agent-response.jq /tmp/agent-response.sse

      - name: Upload staging smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-smoke-evidence
          path: /tmp/agent-response*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 5: Offline evaluation quality gate (golden dataset)
  # ---------------------------------------------------------------------
  evaluate:
    name: Offline evaluation quality gate
    needs: [deploy-staging, staging-tests]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install evaluation SDKs
        run: pip install azure-ai-projects==2.6.0 openai==3.6.0 azure-identity==1.25.3

      - name: Verify full-history follow-up and conversation isolation
        env:
          PROJECT_ENDPOINT: ${{ needs.deploy-staging.outputs.project_endpoint }}
        run: |
          python eval/check_conversation.py \
            --endpoint "$PROJECT_ENDPOINT/agents/$AGENT_NAME/endpoint/protocols/openai/responses?api-version=v1" \
            --output-dir "${{ runner.temp }}/conversation-evidence"

      - name: Retain conversation regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conversation-evidence
          path: ${{ runner.temp }}/conversation-evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Download staging environment state
        uses: actions/download-artifact@v7
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/

      - name: Select staging environment
        run: |
          azd config set auth.useAzCliAuth true
          azd env select "$STAGING_AZD_ENV_NAME"

      - name: Convert golden dataset without dropping cases
        run: |
          set -euo pipefail
          python3 eval/convert_for_ai_agent_evals.py \
            "$GOLDEN_DATASET_PATH" \
            "${{ runner.temp }}/golden_dataset_for_ai_agent_evals.json"

      - name: Capture hosted responses and enforce evaluation policy
        timeout-minutes: 90
        env:
          PROJECT_ENDPOINT: ${{ needs.deploy-staging.outputs.project_endpoint }}
          AGENT_VERSION: ${{ needs.deploy-staging.outputs.agent_version }}
          JUDGE_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_NAME }}
          AZURE_DEV_USER_AGENT: microsoft_foundry_skill
        run: |
          python scripts/ci_results.py \
            --context "${{ runner.temp }}/evaluation-evidence/context.json" \
            --dataset "$GOLDEN_DATASET_PATH" --agent-version "$AGENT_VERSION"
          python eval/run_hosted_evaluation.py \
            --endpoint "$PROJECT_ENDPOINT" --agent "$AGENT_NAME" \
            --version "$AGENT_VERSION" --deployment "$JUDGE_DEPLOYMENT" \
            --dataset "${{ runner.temp }}/golden_dataset_for_ai_agent_evals.json" \
            --output-dir "${{ runner.temp }}/evaluation-evidence" \
            --minimum-pass-rate 1.0

      - name: Upload evaluation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation-evidence/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 6: Manual production-approval gate
  # ---------------------------------------------------------------------
  # No dedicated approval job is needed: gating on the `production`
  # GitHub Environment (with required reviewers configured in repository
  # settings) blocks this job from starting until a human approves it,
  # which *is* the "manual production approval" step from the plan.
  promote-production:
    name: Promote to production
    needs: [evaluate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous_agent_version: ${{ steps.record-previous.outputs.previous_agent_version }}
      promoted_agent_version: ${{ steps.deploy.outputs.agent_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        env:
          DEFENDER_MCP_IMAGE: ${{ needs.deploy-staging.outputs.defender_mcp_image }}
          ANOMALY_MCP_IMAGE: ${{ needs.deploy-staging.outputs.anomaly_mcp_image }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env select "$PRODUCTION_AZD_ENV_NAME" || azd env new "$PRODUCTION_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set FOUNDRY_PROJECT_ENDPOINT "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}"
          azd env set AZURE_AI_PROJECT_ID "${{ vars.AZURE_AI_PROJECT_ID }}"
          azd env set FOUNDRY_MODEL_NAME "${{ vars.FOUNDRY_MODEL_NAME }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          for SERVER in DEFENDER ANOMALY; do
            IMAGE_KEY="${SERVER}_MCP_IMAGE"
            IMAGE="${!IMAGE_KEY}"
            [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::Missing evaluated MCP image digest"; exit 1; }
            azd env set "$IMAGE_KEY" "$IMAGE"
          done

      - name: Record the currently-live production version (for rollback)
        id: record-previous
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION=$(bash scripts/record-production-version.sh "$AGENT_NAME" /tmp/prod-agent-show-before)
          echo "previous_agent_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Provision production infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd provision --no-prompt

      - name: Deploy evaluated source to production (remote rebuild)
        id: deploy
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd deploy --no-prompt
          azd ai agent show "$AGENT_NAME" --output json > /tmp/prod-agent-show.json
          AGENT_VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+$"))' /tmp/prod-agent-show.json)
          jq -e '.status == "active"' /tmp/prod-agent-show.json
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Grant production runtime model access
        run: bash scripts/configure-agent-rbac.sh "$AGENT_NAME"

      - name: Upload azd environment state (for downstream jobs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: azd-env-production
          path: ${{ github.workspace }}/.azure/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload production version evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-version-evidence
          path: /tmp/prod-agent-show*.json
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 7: Post-deploy monitoring check
  # ---------------------------------------------------------------------
  post-deploy-monitoring:
    name: Post-deploy monitoring check
    needs: [promote-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download azd environment state (from promote-production)
        uses: actions/download-artifact@v7
        with:
          name: azd-env-production
          path: ${{ github.workspace }}/.azure/

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env select "$PRODUCTION_AZD_ENV_NAME"

      - name: Post-deploy smoke invoke
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        env:
          AGENT_VERSION: ${{ needs.promote-production.outputs.promoted_agent_version }}
        run: |
          set -euo pipefail
          test -n "$AGENT_VERSION"
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            set +e
            bash scripts/invoke-agent.sh > /tmp/prod-smoke-response.sse 2>/tmp/prod-smoke-response.err
            INVOKE_EXIT=$?
            set -e
            cat /tmp/prod-smoke-response.err
            if [ $INVOKE_EXIT -eq 0 ] && jq -Rse -f scripts/validate-agent-response.jq /tmp/prod-smoke-response.sse; then
              break
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Production version $AGENT_VERSION failed after $MAX_ATTEMPTS fresh-session attempts (invoke exit $INVOKE_EXIT)."
              exit 1
            fi
            echo "::warning::Attempt $attempt failed (exit $INVOKE_EXIT); retrying in 15s."
            sleep 15
          done

      - name: Check Application Insights for post-deploy exceptions (breach signal)
        run: |
          set -euo pipefail
          # A breach here is defined as any AppExceptions row in the 10
          # minutes following promotion. This queries the Log Analytics
          # workspace directly (see repo memory: az monitor app-insights
          # query returns empty for workspace-based App Insights; query
          # the workspace instead).
          WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
            --query customerId -o tsv)
          RESPONSE_ID=$(jq -Rse '
            split("\n") | map(select(startswith("data: ")) | .[6:] | fromjson?)
            | map(select(.type == "response.completed")) | last | .response.id
            | select(type == "string" and test("^resp_[A-Za-z0-9_-]+$"))
          ' /tmp/prod-smoke-response.sse)
          TRACE_COUNT=0
          for attempt in $(seq 1 10); do
            TRACE_COUNT=$(az monitor log-analytics query \
              --workspace "$WORKSPACE_ID" \
              --analytics-query "AppTraces | where TimeGenerated > ago(30m) | where Message contains '$RESPONSE_ID' | count" \
              --query "[0].Count" -o tsv)
            if ! [[ "$TRACE_COUNT" =~ ^[0-9]+$ ]]; then
              echo "::error::Telemetry query returned no valid trace count. Health is unknown."
              exit 1
            fi
            if [ "$TRACE_COUNT" -gt "0" ]; then
              break
            fi
            if [ "$attempt" -lt "10" ]; then
              sleep 30
            fi
          done
          if [ "$TRACE_COUNT" -eq "0" ]; then
            echo "::error::No ingested telemetry for smoke response $RESPONSE_ID. Health is unknown."
            exit 1
          fi
          echo "Verified ingested telemetry for smoke response $RESPONSE_ID: $TRACE_COUNT row(s)."
          EXCEPTION_COUNT=$(az monitor log-analytics query \
            --workspace "$WORKSPACE_ID" \
            --analytics-query "AppExceptions | where TimeGenerated > ago(10m) | count" \
            --query "[0].Count" -o tsv)
          if ! [[ "$EXCEPTION_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Telemetry query returned no valid exception count. Health is unknown."
            exit 1
          fi
          echo "Post-deploy exception count (last 10m): $EXCEPTION_COUNT"
          if [ "$EXCEPTION_COUNT" -gt "0" ]; then
            echo "::error::Detected $EXCEPTION_COUNT exception(s) in Application Insights within 10 minutes of production promotion."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Stage 8: Rollback on breach
  # ---------------------------------------------------------------------
  recovery-required:
    name: Manual production recovery required
    needs: [promote-production, post-deploy-monitoring]
    if: always() && (needs.promote-production.result == 'failure' || needs.post-deploy-monitoring.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Report partial deployment or monitoring failure
        env:
          PREVIOUS_VERSION: ${{ needs.promote-production.outputs.previous_agent_version }}
          DEPLOYED_VERSION: ${{ needs.promote-production.outputs.promoted_agent_version }}
        run: |
          echo "::error::Production may have changed. Inspect production-version-evidence and azd-env-production. Automatic rollback is not implemented."
          echo "Previous version: ${PREVIOUS_VERSION:-unknown}; deployed version: ${DEPLOYED_VERSION:-unknown}." >> "$GITHUB_STEP_SUMMARY"
          echo "Manual recovery required. Do not redeploy current source as a rollback." >> "$GITHUB_STEP_SUMMARY"
          exit 1
