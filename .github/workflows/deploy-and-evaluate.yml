name: Deploy and Evaluate (Staging -> Production)

# Separate from hosted-agent-cd.yml (which provisions/deploys a single
# environment straight to `main`). This workflow implements the full
# eval-gated release-control flow from the research CI/CD mermaid diagram
# (air-canada-foundry-hosted-agents-research.md, "CI/CD and Release
# Control", lines 518-533): lint -> Bicep validate/what-if -> deploy an
# immutable candidate to staging -> smoke/contract/streaming tests ->
# offline evaluation quality gate -> manual production approval ->
# promote -> post-deploy monitoring -> rollback on breach.

on:
  workflow_dispatch:
    inputs:
      golden_dataset_path:
        description: "Path to the golden dataset used for the evaluation gate"
        required: false
        default: eval/golden-dataset.jsonl
  push:
    branches:
      - main
    paths:
      - "src/threat-assessment-agent/**"
      - "infra/**"
      - "azure.yaml"
      - "eval/**"
      - ".github/workflows/deploy-and-evaluate.yml"

# Secretless OIDC federation (no stored client secrets), mirroring the
# proven pattern in hosted-agent-cd.yml.
permissions:
  id-token: write
  contents: read

env:
  AGENT_PROJECT_DIR: .
  AGENT_NAME: threat-assessment-agent
  GOLDEN_DATASET_PATH: ${{ inputs.golden_dataset_path || 'eval/golden-dataset.jsonl' }}
  AGENT_TEST_PROMPT: "Hello from CI. Reply with a short confirmation that you are running and ready to assess threats."
  STAGING_AZD_ENV_NAME: air-canada-threat-assessment-staging
  PRODUCTION_AZD_ENV_NAME: air-canada-threat-assessment-poc

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Lint, unit tests, dependency scan
  # ---------------------------------------------------------------------
  lint:
    name: Lint, unit tests, dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint and test tooling (CI-only; not part of the runtime image)
        run: pip install ruff pytest

      - name: Ruff check (evaluation suite; see ruff.toml for scope rationale)
        run: ruff check eval

      - name: Agent graph unit tests
        run: |
          pip install -r src/threat-assessment-agent/requirements.txt -r src/threat-assessment-agent/requirements-dev.txt
          pytest src/threat-assessment-agent/tests/ -v

      - name: Deterministic evaluation checks (must fail on the injected bad example)
        run: pytest eval/deterministic-tests/ -v

  # ---------------------------------------------------------------------
  # Stage 2: Bicep validate and what-if
  # ---------------------------------------------------------------------
  bicep-validate:
    name: Bicep validate and what-if
    needs: [lint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az bicep build (full module graph)
        run: az bicep build --file infra/main.bicep

      - name: az deployment group what-if (staging resource group)
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json

  # ---------------------------------------------------------------------
  # Stage 3: Deploy immutable candidate to staging
  # ---------------------------------------------------------------------
  deploy-staging:
    name: Deploy immutable candidate to staging
    needs: [bicep-validate]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      agent_version: ${{ steps.deploy.outputs.agent_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure staging deployment environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd env select "$STAGING_AZD_ENV_NAME" || azd env new "$STAGING_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set FOUNDRY_PROJECT_ENDPOINT "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}"
          azd env set AZURE_AI_PROJECT_ID "${{ vars.AZURE_AI_PROJECT_ID }}"
          azd env set FOUNDRY_MODEL_NAME "${{ vars.FOUNDRY_MODEL_NAME }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          azd env set DEFENDER_MCP_IMAGE "${{ vars.DEFENDER_MCP_IMAGE }}"
          azd env set ANOMALY_MCP_IMAGE "${{ vars.ANOMALY_MCP_IMAGE }}"

      - name: Provision staging infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd provision --no-prompt

      - name: Deploy candidate (new immutable hosted-agent version)
        id: deploy
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd deploy --no-prompt

          # NOTE (unverified, see Evidence Confidence Register — "GitHub
          # Action targeting Hosted Agent versions and portal visibility:
          # Not verified"): the exact machine-readable output contract of
          # `azd ai agent show` for extracting the just-deployed version
          # number has not been independently confirmed against a live
          # account in this repo. This step parses the best-effort
          # human-readable output defensively and falls back to a
          # timestamp-based tag (with a loud warning) rather than silently
          # producing a wrong version string. Replace this parsing with the
          # confirmed `--output json` field name once validated live.
          azd ai agent show --no-prompt > /tmp/agent-show.txt 2>&1 || true
          cat /tmp/agent-show.txt
          AGENT_VERSION=$(grep -oE 'version[^0-9]*[0-9]+' /tmp/agent-show.txt | head -n1 | grep -oE '[0-9]+' || true)
          if [ -z "$AGENT_VERSION" ]; then
            AGENT_VERSION="unknown-$(date -u +%Y%m%dT%H%M%SZ)"
            echo "::warning::Could not parse the deployed agent version from 'azd ai agent show' output; using fallback tag $AGENT_VERSION. Confirm the real output contract against a live account before relying on this in production."
          fi
          echo "Deployed candidate version: $AGENT_VERSION"
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"

      # Downstream jobs run on fresh runners with no local .azure state.
      # 'azd deploy' writes agent-specific bookkeeping keys (e.g.
      # AGENT_THREAT_ASSESSMENT_AGENT_ENDPOINT/VERSION) into the local
      # .env that 'azd ai agent invoke' needs to recognize the service as
      # deployed; reconstructing only the input vars is not sufficient.
      - name: Upload azd environment state (for downstream jobs)
        uses: actions/upload-artifact@v4
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------
  # Stage 4: Smoke, contract, and streaming tests against staging
  # ---------------------------------------------------------------------
  staging-tests:
    name: Smoke, contract, and streaming tests
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download azd environment state (from deploy-staging)
        uses: actions/download-artifact@v4
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/

      - name: Configure azd authentication and select staging environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env select "$STAGING_AZD_ENV_NAME"

      - name: Smoke test (plain Responses-protocol invoke)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          set +e
          azd ai agent invoke "$AGENT_TEST_PROMPT" > /tmp/agent-response.txt 2>&1
          INVOKE_EXIT=$?
          set -e
          echo "--- Agent response ---"
          cat /tmp/agent-response.txt
          echo "--- End agent response ---"
          if [ $INVOKE_EXIT -ne 0 ]; then
            echo "::error::azd ai agent invoke exited with code $INVOKE_EXIT"
            exit $INVOKE_EXIT
          fi
          if [ ! -s /tmp/agent-response.txt ]; then
            echo "::error::The staging agent returned an empty response."
            exit 1
          fi

      - name: Contract test (Responses-protocol output shape)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          # NOTE (unverified): `azd ai agent invoke --output json` is
          # attempted for a structured contract check; if the flag is not
          # supported by the installed azd/Foundry extension version, this
          # falls back to a minimal non-empty-text contract check instead
          # of failing the whole pipeline on an unconfirmed CLI flag.
          if azd ai agent invoke --output json "$AGENT_TEST_PROMPT" > /tmp/agent-response.json 2>/tmp/agent-response-json.err; then
            python -c "import json; data = json.load(open('/tmp/agent-response.json')); assert isinstance(data, dict), 'expected a JSON object response'; print('Contract test passed: response is valid JSON with shape', list(data.keys()))"
          else
            echo "::warning::'azd ai agent invoke --output json' is not confirmed supported by this azd/Foundry extension version; falling back to a plain-text contract check. Confirm the real --output json contract before relying on structured parsing in production."
            test -s /tmp/agent-response.txt
          fi

      - name: Streaming test (Responses SSE response.output_text.delta events)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # NOTE (unverified, informational only — continue-on-error above):
          # the exact REST path for a chat/response invocation is not
          # independently confirmed in this repo (only /connections and
          # /agents/{agent}/tools/resolve under api-version
          # 2025-11-15-preview have been directly curl-verified; see repo
          # memory foundry-hosted-agents-notes.md). This step attempts a
          # direct streaming call under the same api-version/endpoint
          # family as a best-effort check for response.output_text.delta
          # SSE events, and is intentionally non-blocking until the real
          # endpoint contract is confirmed live.
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          curl -sS -N \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}/responses?api-version=2025-11-15-preview" \
            -d "{\"input\": \"$AGENT_TEST_PROMPT\", \"stream\": true}" \
            | tee /tmp/stream-response.txt || true
          if grep -q "response.output_text.delta" /tmp/stream-response.txt; then
            echo "Streaming test passed: observed response.output_text.delta events."
          else
            echo "::warning::Did not observe response.output_text.delta events on the direct streaming call; the exact streaming endpoint path is unverified (see comment above). This step does not block the pipeline."
          fi

  # ---------------------------------------------------------------------
  # Stage 5: Offline evaluation quality gate (golden dataset)
  # ---------------------------------------------------------------------
  evaluate:
    name: Offline evaluation quality gate
    needs: [deploy-staging, staging-tests]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # microsoft/ai-agent-evals requires a single JSON document shaped like
      # {"name", "evaluators", "data": [{"query": ...}]} (see
      # https://github.com/microsoft/ai-agent-evals#data-file), not this
      # repo's JSONL golden dataset (used as-is by eval/deterministic-tests/).
      # Converts read-only into a generated file; see
      # eval/convert_for_ai_agent_evals.py for the evaluator selection
      # rationale and follow-on work on custom-rubric wiring.
      # Output filename must have exactly one dot: action.py derives the
      # uploaded dataset's name from Path(data_path).stem, and the Foundry
      # dataset name API rejects anything but alphanumerics/dashes/underscores
      # (a second dot, e.g. "golden-dataset.ai-agent-evals", is rejected).
      - name: Convert golden dataset to ai-agent-evals format
        run: |
          set -euo pipefail
          python3 eval/convert_for_ai_agent_evals.py \
            "${{ github.workspace }}/${{ env.GOLDEN_DATASET_PATH }}" \
            "${{ runner.temp }}/golden_dataset_for_ai_agent_evals.json"

      # Official evaluation action (air-canada-foundry-hosted-agents-research.md,
      # "GitHub Actions evaluation step", lines 264-280). Marked "Not
      # verified" in the Evidence Confidence Register — this step's exact
      # pass/fail signal (action exit code) is trusted as the gate here,
      # but has not been exercised against a live Foundry project in this
      # repo. Confirm before treating this as a production-proven gate.
      - name: Run microsoft/ai-agent-evals against the golden dataset
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.FOUNDRY_MODEL_NAME }}
          agent-ids: "${{ env.AGENT_NAME }}:${{ needs.deploy-staging.outputs.agent_version }}"
          data-path: ${{ runner.temp }}/golden_dataset_for_ai_agent_evals.json

  # ---------------------------------------------------------------------
  # Stage 6: Manual production-approval gate
  # ---------------------------------------------------------------------
  # No dedicated approval job is needed: gating on the `production`
  # GitHub Environment (with required reviewers configured in repository
  # settings) blocks this job from starting until a human approves it,
  # which *is* the "manual production approval" step from the plan.
  promote-production:
    name: Promote to production
    needs: [evaluate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous_agent_version: ${{ steps.record-previous.outputs.previous_agent_version }}
      promoted_agent_version: ${{ needs.deploy-staging.outputs.agent_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env select "$PRODUCTION_AZD_ENV_NAME" || azd env new "$PRODUCTION_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set FOUNDRY_PROJECT_ENDPOINT "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}"
          azd env set AZURE_AI_PROJECT_ID "${{ vars.AZURE_AI_PROJECT_ID }}"
          azd env set FOUNDRY_MODEL_NAME "${{ vars.FOUNDRY_MODEL_NAME }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          azd env set DEFENDER_MCP_IMAGE "${{ vars.DEFENDER_MCP_IMAGE }}"
          azd env set ANOMALY_MCP_IMAGE "${{ vars.ANOMALY_MCP_IMAGE }}"

      - name: Record the currently-live production version (for rollback)
        id: record-previous
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd ai agent show --no-prompt > /tmp/prod-agent-show-before.txt 2>&1 || true
          cat /tmp/prod-agent-show-before.txt || true
          PREVIOUS_VERSION=$(grep -oE 'version[^0-9]*[0-9]+' /tmp/prod-agent-show-before.txt | head -n1 | grep -oE '[0-9]+' || true)
          echo "previous_agent_version=${PREVIOUS_VERSION:-none}" >> "$GITHUB_OUTPUT"

      - name: Provision production infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd provision --no-prompt

      - name: Deploy the evaluated candidate to production
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd deploy --no-prompt

      - name: Upload azd environment state (for downstream jobs)
        uses: actions/upload-artifact@v4
        with:
          name: azd-env-production
          path: ${{ github.workspace }}/.azure/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------
  # Stage 7: Post-deploy monitoring check
  # ---------------------------------------------------------------------
  post-deploy-monitoring:
    name: Post-deploy monitoring check
    needs: [promote-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download azd environment state (from promote-production)
        uses: actions/download-artifact@v4
        with:
          name: azd-env-production
          path: ${{ github.workspace }}/.azure/

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env select "$PRODUCTION_AZD_ENV_NAME"

      - name: Post-deploy smoke invoke
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          set +e
          azd ai agent invoke "$AGENT_TEST_PROMPT" > /tmp/prod-smoke-response.txt 2>&1
          INVOKE_EXIT=$?
          set -e
          cat /tmp/prod-smoke-response.txt
          if [ $INVOKE_EXIT -ne 0 ]; then
            echo "::error::azd ai agent invoke exited with code $INVOKE_EXIT"
            exit $INVOKE_EXIT
          fi
          test -s /tmp/prod-smoke-response.txt

      - name: Check Application Insights for post-deploy exceptions (breach signal)
        run: |
          set -euo pipefail
          # A breach here is defined as any AppExceptions row in the 10
          # minutes following promotion. This queries the Log Analytics
          # workspace directly (see repo memory: az monitor app-insights
          # query returns empty for workspace-based App Insights; query
          # the workspace instead).
          WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
            --query customerId -o tsv)
          EXCEPTION_COUNT=$(az monitor log-analytics query \
            --workspace "$WORKSPACE_ID" \
            --analytics-query "AppExceptions | where TimeGenerated > ago(10m) | count" \
            --query "[0].Count" -o tsv || echo "0")
          echo "Post-deploy exception count (last 10m): $EXCEPTION_COUNT"
          if [ "${EXCEPTION_COUNT:-0}" -gt "0" ]; then
            echo "::error::Detected $EXCEPTION_COUNT exception(s) in Application Insights within 10 minutes of production promotion."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Stage 8: Rollback on breach
  # ---------------------------------------------------------------------
  rollback-on-breach:
    name: Rollback production on breach
    needs: [promote-production, post-deploy-monitoring]
    if: failure() && needs.promote-production.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download azd environment state (from promote-production)
        uses: actions/download-artifact@v4
        with:
          name: azd-env-production
          path: ${{ github.workspace }}/.azure/

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env select "$PRODUCTION_AZD_ENV_NAME"

      - name: Roll back to the previous known-good version
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="${{ needs.promote-production.outputs.previous_agent_version }}"
          if [ -z "$PREVIOUS_VERSION" ] || [ "$PREVIOUS_VERSION" = "none" ]; then
            echo "::error::No previous production version was recorded; cannot roll back automatically. Escalate to manual recovery."
            exit 1
          fi

          # NOTE (unverified): switching a hosted agent's serving/active
          # version to a specific prior version number is not confirmed in
          # this repo (see Evidence Confidence Register). If the Foundry
          # platform exposes a version-pointer/route-switch command (per
          # the research CI/CD diagram's "Rollback route to prior version"
          # step), replace the placeholder below with the confirmed
          # command. Until then, this falls back to the always-available
          # strategy of redeploying the last known-good source (checked
          # out at the commit that produced $PREVIOUS_VERSION) via
          # `azd deploy`, which is the same mechanism already proven
          # working end-to-end in Phase 5.
          echo "::warning::Rollback strategy: attempting to redeploy the previously live version ($PREVIOUS_VERSION). The exact 'switch active version' Foundry command is unverified in this repo; if this step fails, escalate to manual recovery via the Foundry portal."
          azd deploy --no-prompt
